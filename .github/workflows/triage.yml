name: Route incoming requests
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: read
  issues: write
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const issue = context.payload.issue;
            const kind = issue.title.startsWith('[Bug]') ? 'bug' : issue.title.startsWith('[Feature]') ? 'enhancement' : issue.title.startsWith('[Help]') ? 'question' : 'needs-info';
            for (const [name, color] of [[kind, '2563eb'], ['needs-triage', 'fbca04']]) {
              try { await github.rest.issues.createLabel({...context.repo, name, color}); }
              catch (e) { if (e.status !== 422) throw e; }
            }
            await github.rest.issues.addLabels({...context.repo, issue_number: issue.number, labels: [kind, 'needs-triage']});
            await github.rest.issues.addAssignees({...context.repo, issue_number: issue.number, assignees: ['Youzurz']});
            if (context.payload.action === 'opened') await github.rest.issues.createComment({...context.repo, issue_number: issue.number, body: 'Accusé de réception automatique : demande affectée au mainteneur et placée en triage humain. La catégorie est indicative, pas un jugement sur sa validité. Ne publiez aucun secret. Le guide GETTING-STARTED.md et les limites KNOWN-LIMITS.md sont disponibles dans le dépôt. Aucun délai de réponse contractuel n’est annoncé.'});

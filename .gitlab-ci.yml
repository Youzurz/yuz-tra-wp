stages:
  - validate
  - package
  - release
  - deploy

default:
  image: php:8.2-cli-bookworm
  before_script:
    - apt-get update
    - apt-get install -y git rsync zip curl

variables:
  GIT_STRATEGY: fetch

validate:
  stage: validate
  script:
    - scripts/check-release.sh "${CI_COMMIT_TAG:-}"
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

package:
  stage: package
  script:
    - scripts/check-release.sh "${CI_COMMIT_TAG:-}"
    - mkdir -p dist
    - scripts/build-zip.sh
  artifacts:
    expire_in: 30 days
    paths:
      - dist/
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  before_script: []
  needs:
    - job: package
      artifacts: true
  artifacts:
    expire_in: 30 days
    paths:
      - dist/
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'YUZ Translation $CI_COMMIT_TAG'
    description: './docs/release-notes.md'
    assets:
      links:
        - name: 'yuz-tra-wp ZIP'
          url: '${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/dist/yuz-tra-wp.zip'
          link_type: package
  rules:
    - if: '$CI_COMMIT_TAG'

deploy_wporg:
  stage: deploy
  needs:
    - job: package
      artifacts: true
  before_script:
    - apt-get update
    - apt-get install -y git rsync zip subversion
  script:
    - scripts/deploy-wporg.sh
  rules:
    - if: '$CI_COMMIT_TAG && $WPORG_DEPLOY == "1"'
